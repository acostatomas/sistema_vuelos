<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Configurar Perfil</title>
</head>
<body class="d-flex flex-column min-vh-100">
    {% include 'navbar.html' %}
    {% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
    {% endfor %}
    {% endif %}
    <!-- Encabezado -->
    <header class="bg-light text-center py-5 mb-4">
        <div class="container">
            <h1 class="fw-bold">PERFIL PERSONAL</h1>
            <p class="lead">Editar la información personal</p>
        </div>
    </header>
    <div  class="container mt-3" style="max-width: 500px;">
        <div class="card shadow rounded">
            <div class="card-body">
                <form action="" method="post">
                    {%csrf_token%}
                    {{form}}
                    <button class="btn btn-success bg-green mt-2">Guardar Cambios</button>
                    <a class="btn btn-danger bg-green mt-2" href="{% url 'inicio' %}">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
    <!-- Footer -->
    <footer class="bg-primary text-white text-center py-4 mt-auto">
        <p class="mb-0"> &copy; Acosta Tomás - UCEMA</p>
    </footer>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
