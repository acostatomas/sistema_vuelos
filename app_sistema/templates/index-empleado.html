<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    {% include 'navbar-empleado.html'%}

    <!-- Encabezado -->
    <header class="bg-light text-center py-5 mb-4">
        <div class="container">
            <h1 class="fw-bold">SISTEMA DE GESTIÓN DE VUELOS</h1>
            <p class="lead">Gestionar los vuelos en curso</p>
        </div>
    </header>

    <!-- Cards de libros -->
    <div class="container">
        <div class="row g-4">
            <!-- VER VUELOS -->
            <div class="col-md-4">
                <div class="card h-80 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title text-center"><a class="text-decoration-none text-black" href="{% url 'vuelos'%}">VER VUELOS</a></h5>
                    </div>
                </div>
            </div>

            <!-- CREAR VUELO -->
            <div class="col-md-4">
                <div class="card h-80 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title text-center"><a class="text-decoration-none text-black" href="{% url 'nuevo_vuelo'%}">CREAR VUELO</a></h5>
                    </div>
                </div>
            </div>

            <!-- BUSCAR VUELO -->
            <div class="col-md-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title text-center"><a class="text-decoration-none text-black" href="{% url 'buscarVuelo'%}">BUSCAR VUELO</a></h5>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <!-- Footer -->
    <footer class="bg-primary text-white text-center py-4 mt-auto">
        <p class="mb-0"> &copy; Acosta Tomás - UCEMA</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
